<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সোশ্যাল মিডিয়া পোস্ট মেকার</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .controls-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            height: fit-content;
        }

        .control-section {
            margin-bottom: 25px;
        }

        .control-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .canvas-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            border: 3px solid #667eea;
            border-radius: 10px;
            max-width: 100%;
            cursor: crosshair;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            margin-bottom: 10px;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .template-btn {
            padding: 30px 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            font-weight: bold;
            transition: all 0.3s;
            color: #333;
        }

        .template-btn:hover {
            transform: scale(1.05);
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .color-picker-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .color-picker-wrapper input[type="color"] {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .action-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .preview-image {
            max-width: 100px;
            max-height: 100px;
            border-radius: 8px;
            margin-top: 10px;
            border: 2px solid #ddd;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 প্রফেশনাল পোস্ট মেকার</h1>
            <p>আপনার টিমের জন্য সুন্দর সোশ্যাল মিডিয়া পোস্ট তৈরি করুন</p>
        </div>

        <div class="main-content">
            <div class="controls-panel">
                <div class="control-section">
                    <h3>📐 টেমপ্লেট সিলেক্ট করুন</h3>
                    <div class="template-grid">
                        <button class="template-btn" onclick="selectTemplate('match')">ম্যাচ আপডেট</button>
                        <button class="template-btn" onclick="selectTemplate('player')">প্লেয়ার স্ট্যাট</button>
                        <button class="template-btn" onclick="selectTemplate('score')">স্কোর কার্ড</button>
                        <button class="template-btn" onclick="selectTemplate('announcement')">ঘোষণা</button>
                    </div>
                </div>

                <div class="control-section">
                    <h3>🖼️ ছবি আপলোড করুন</h3>
                    <div class="file-input-wrapper">
                        <input type="file" id="playerImage" accept="image/*" onchange="uploadPlayerImage(event)">
                        <label for="playerImage" class="file-input-label">প্লেয়ার ছবি</label>
                    </div>
                    <div class="file-input-wrapper">
                        <input type="file" id="logoImage" accept="image/*" onchange="uploadLogo(event)">
                        <label for="logoImage" class="file-input-label">টিম লোগো</label>
                    </div>
                    <div id="imagePreview"></div>
                </div>

                <div class="control-section">
                    <h3>✏️ টেক্সট যোগ করুন</h3>
                    <div class="input-group">
                        <label>প্রধান টেক্সট:</label>
                        <input type="text" id="mainText" placeholder="যেমন: MATCH UPDATE" oninput="updateCanvas()">
                    </div>
                    <div class="input-group">
                        <label>সাব টেক্সট:</label>
                        <input type="text" id="subText" placeholder="যেমন: 20 OVERS" oninput="updateCanvas()">
                    </div>
                    <div class="input-group">
                        <label>স্কোর/অতিরিক্ত টেক্সট:</label>
                        <input type="text" id="scoreText" placeholder="যেমন: 150/4" oninput="updateCanvas()">
                    </div>
                    <div class="input-group">
                        <label>ফন্ট সাইজ: <span id="fontSizeValue">60</span>px</label>
                        <input type="range" id="fontSize" min="20" max="120" value="60" oninput="document.getElementById('fontSizeValue').textContent = this.value; updateCanvas()">
                    </div>
                </div>

                <div class="control-section">
                    <h3>🎨 রঙ সিলেক্ট করুন</h3>
                    <div class="input-group">
                        <label>ব্যাকগ্রাউন্ড রঙ:</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="bgColor1" value="#1e3a8a" onchange="updateCanvas()">
                            <input type="color" id="bgColor2" value="#3b82f6" onchange="updateCanvas()">
                            <span style="font-size: 12px;">গ্রেডিয়েন্ট</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>টেক্সট রঙ:</label>
                        <input type="color" id="textColor" value="#fbbf24" onchange="updateCanvas()">
                    </div>
                </div>

                <div class="control-section">
                    <button class="btn btn-primary" onclick="addText()">টেক্সট যোগ করুন</button>
                    <button class="btn btn-success" onclick="downloadImage()">ডাউনলোড করুন</button>
                    <button class="btn btn-primary" onclick="clearCanvas()">রিসেট করুন</button>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="canvas" width="1080" height="1080"></canvas>
                <div class="action-buttons">
                    <button class="btn btn-success" onclick="downloadImage()">📥 ডাউনলোড করুন</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let playerImg = null;
        let logoImg = null;
        let currentTemplate = 'match';

        function removeBackground(img) {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = img.width;
            tempCanvas.height = img.height;
            
            tempCtx.drawImage(img, 0, 0);
            const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = imageData.data;
            
            // Advanced background removal algorithm
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // Multiple conditions for better background removal
                const isWhite = r > 200 && g > 200 && b > 200;
                const isLightGray = r > 180 && g > 180 && b > 180 && Math.abs(r - g) < 20 && Math.abs(g - b) < 20;
                const isBeige = r > 200 && g > 190 && b > 170 && r - b < 50;
                const isPaleColor = r > 190 && g > 190 && (Math.abs(r - g) < 30);
                
                // Sky/Stadium background colors
                const isLightBlue = b > 150 && r > 120 && g > 120 && b > r && b > g;
                const isSkyBlue = b > r + 20 && b > g + 20 && r > 100;
                
                // Green field/pitch colors
                const isGreen = g > r + 20 && g > b + 10 && g > 80;
                
                if (isWhite || isLightGray || isBeige || isPaleColor || isLightBlue || isSkyBlue || isGreen) {
                    data[i + 3] = 0; // Make transparent
                }
            }
            
            tempCtx.putImageData(imageData, 0, 0);
            return tempCanvas;
        }

        function uploadPlayerImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        playerImg = removeBackground(img);
                        updateCanvas();
                        
                        const preview = document.getElementById('imagePreview');
                        preview.innerHTML = '<img src="' + e.target.result + '" class="preview-image" alt="Preview">';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function uploadLogo(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        logoImg = img;
                        updateCanvas();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function selectTemplate(template) {
            currentTemplate = template;
            updateCanvas();
        }

        function drawGradientBackground() {
            const color1 = document.getElementById('bgColor1').value;
            const color2 = document.getElementById('bgColor2').value;
            
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, color1);
            gradient.addColorStop(1, color2);
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function updateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGradientBackground();
            
            if (currentTemplate === 'match') {
                drawMatchTemplate();
            } else if (currentTemplate === 'player') {
                drawPlayerTemplate();
            } else if (currentTemplate === 'score') {
                drawScoreTemplate();
            } else if (currentTemplate === 'announcement') {
                drawAnnouncementTemplate();
            }
            
            if (logoImg) {
                ctx.drawImage(logoImg, canvas.width - 200, 50, 150, 150);
            }
        }

        function drawMatchTemplate() {
            const mainText = document.getElementById('mainText').value || 'MATCH UPDATE';
            const subText = document.getElementById('subText').value || '20 OVERS';
            const scoreText = document.getElementById('scoreText').value || '150/4';
            const textColor = document.getElementById('textColor').value;
            const fontSize = document.getElementById('fontSize').value;
            
            // Top banner with gradient
            const topGradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            topGradient.addColorStop(0, 'rgba(255,215,0,0.3)');
            topGradient.addColorStop(1, 'rgba(255,165,0,0.3)');
            ctx.fillStyle = topGradient;
            ctx.fillRect(0, 0, canvas.width, 250);
            
            // Main text with shadow
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;
            
            ctx.fillStyle = textColor;
            ctx.font = `bold ${fontSize * 1.2}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText(mainText, canvas.width / 2, 150);
            
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            
            // Player image with better positioning
            if (playerImg) {
                const imgWidth = 650;
                const imgHeight = 650;
                ctx.drawImage(playerImg, (canvas.width - imgWidth) / 2, 280, imgWidth, imgHeight);
            }
            
            // Bottom section with dark overlay
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(0, canvas.height - 280, canvas.width, 280);
            
            // Decorative line
            ctx.fillStyle = textColor;
            ctx.fillRect(200, canvas.height - 290, canvas.width - 400, 6);
            
            // Score with large font
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 20;
            ctx.font = `bold ${parseInt(fontSize) * 1.8}px Arial`;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(scoreText, canvas.width / 2, canvas.height - 150);
            
            ctx.shadowBlur = 0;
            
            // Sub text
            ctx.font = `${fontSize * 0.7}px Arial`;
            ctx.fillStyle = textColor;
            ctx.fillText(subText, canvas.width / 2, canvas.height - 70);
        }

        function drawPlayerTemplate() {
            const mainText = document.getElementById('mainText').value || 'HARSHIT RANA';
            const subText = document.getElementById('subText').value || 'for DEL vs SER';
            const scoreText = document.getElementById('scoreText').value || '4/47';
            const textColor = document.getElementById('textColor').value;
            const fontSize = document.getElementById('fontSize').value;
            
            // Side banner design
            ctx.fillStyle = 'rgba(255,215,0,0.2)';
            ctx.fillRect(0, 0, 350, canvas.height);
            
            // Player image - larger and centered
            if (playerImg) {
                const imgWidth = 750;
                const imgHeight = 750;
                ctx.drawImage(playerImg, (canvas.width - imgWidth) / 2 + 100, 180, imgWidth, imgHeight);
            }
            
            // Left side text area with overlay
            const leftGradient = ctx.createLinearGradient(0, 200, 400, 200);
            leftGradient.addColorStop(0, 'rgba(0,0,0,0.85)');
            leftGradient.addColorStop(1, 'rgba(0,0,0,0.3)');
            ctx.fillStyle = leftGradient;
            ctx.fillRect(0, 150, 450, 700);
            
            // Main heading (Player name)
            ctx.textAlign = 'left';
            ctx.shadowColor = 'rgba(0,0,0,0.7)';
            ctx.shadowBlur = 10;
            
            // Split name into parts for styling
            const nameParts = mainText.split(' ');
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${fontSize * 1.1}px Arial`;
            ctx.fillText(nameParts[0] || 'PLAYER', 80, 400);
            
            ctx.fillStyle = textColor;
            ctx.font = `bold ${fontSize * 1.1}px Arial`;
            ctx.fillText(nameParts[1] || 'NAME', 80, 480);
            
            ctx.shadowBlur = 0;
            
            // Score with dramatic styling
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${fontSize * 2.2}px Arial`;
            ctx.textAlign = 'left';
            ctx.fillText(scoreText, 80, 630);
            
            ctx.shadowBlur = 0;
            
            // Sub text
            ctx.fillStyle = textColor;
            ctx.font = `${fontSize * 0.55}px Arial`;
            ctx.fillText(subText, 80, 720);
            
            // Decorative elements
            ctx.fillStyle = textColor;
            ctx.fillRect(80, 750, 250, 4);
        }

        function drawScoreTemplate() {
            const mainText = document.getElementById('mainText').value || 'HALF CENTURY';
            const subText = document.getElementById('subText').value || 'VS RANGPUR RIDERS';
            const scoreText = document.getElementById('scoreText').value || '50*';
            const textColor = document.getElementById('textColor').value;
            const fontSize = document.getElementById('fontSize').value;
            
            // Diagonal design element
            ctx.save();
            ctx.fillStyle = 'rgba(255,215,0,0.15)';
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(-25 * Math.PI / 180);
            ctx.fillRect(-600, -600, 1200, 1200);
            ctx.restore();
            
            // Large score number with extreme styling
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 25;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;
            
            // Stroke for score
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 8;
            ctx.font = `bold ${fontSize * 3.5}px Arial`;
            ctx.strokeText(scoreText, canvas.width / 2, 350);
            
            // Fill for score
            ctx.fillStyle = textColor;
            ctx.fillText(scoreText, canvas.width / 2, 350);
            
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            
            // Player image below score
            if (playerImg) {
                const imgSize = 600;
                ctx.save();
                ctx.globalAlpha = 0.95;
                ctx.drawImage(playerImg, (canvas.width - imgSize) / 2, 380, imgSize, imgSize);
                ctx.restore();
            }
            
            // Bottom banner
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0, canvas.height - 250, canvas.width, 250);
            
            // Main achievement text
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.fillStyle = textColor;
            ctx.font = `bold ${fontSize * 1.3}px Arial`;
            ctx.fillText(mainText, canvas.width / 2, canvas.height - 140);
            
            ctx.shadowBlur = 0;
            
            // Decorative line
            ctx.fillStyle = textColor;
            ctx.fillRect(canvas.width / 2 - 200, canvas.height - 105, 400, 3);
            
            // Sub text
            ctx.fillStyle = '#ffffff';
            ctx.font = `${fontSize * 0.6}px Arial`;
            ctx.fillText(subText, canvas.width / 2, canvas.height - 60);
        }

        function drawAnnouncementTemplate() {
            const mainText = document.getElementById('mainText').value || 'THE LESSON';
            const subText = document.getElementById('subText').value || 'MIGHT, TESTED. IRON, FORGED.';
            const additionalText = document.getElementById('scoreText').value || 'NO EXCUSES, ONLY LESSONS.';
            const textColor = document.getElementById('textColor').value;
            const fontSize = document.getElementById('fontSize').value;
            
            // Dark overlay for dramatic effect
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Top section with gradient
            const topGradient = ctx.createLinearGradient(0, 0, 0, 400);
            topGradient.addColorStop(0, 'rgba(0,0,0,0.8)');
            topGradient.addColorStop(1, 'rgba(0,0,0,0.2)');
            ctx.fillStyle = topGradient;
            ctx.fillRect(0, 0, canvas.width, 400);
            
            // Main dramatic heading
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 5;
            
            ctx.fillStyle = textColor;
            ctx.font = `bold ${fontSize * 2}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText(mainText, canvas.width / 2, 220);
            
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            
            // Subtitle
            ctx.fillStyle = '#ffffff';
            ctx.font = `${fontSize * 0.5}px Arial`;
            ctx.fillText(subText, canvas.width / 2, 310);
            
            // Player images side by side if available
            if (playerImg) {
                const imgWidth = 450;
                const imgHeight = 450;
                
                // Left player
                ctx.save();
                ctx.globalAlpha = 0.9;
                ctx.drawImage(playerImg, 150, 400, imgWidth, imgHeight);
                
                // Right player (mirrored)
                ctx.scale(-1, 1);
                ctx.drawImage(playerImg, -canvas.width + 150, 400, imgWidth, imgHeight);
                ctx.restore();
            }
            
            // Bottom banner
            const bottomGradient = ctx.createLinearGradient(0, canvas.height - 250, 0, canvas.height);
            bottomGradient.addColorStop(0, 'rgba(0,0,0,0.3)');
            bottomGradient.addColorStop(1, 'rgba(0,0,0,0.9)');
            ctx.fillStyle = bottomGradient;
            ctx.fillRect(0, canvas.height - 250, canvas.width, 250);
            
            // Additional text at bottom
            ctx.fillStyle = textColor;
            ctx.font = `bold ${fontSize * 0.7}px Arial`;
            ctx.fillText(additionalText, canvas.width / 2, canvas.height - 100);
        }

        function addText() {
            updateCanvas();
        }

        function clearCanvas() {
            playerImg = null;
            logoImg = null;
            document.getElementById('mainText').value = '';
            document.getElementById('subText').value = '';
            document.getElementById('scoreText').value = '';
            document.getElementById('imagePreview').innerHTML = '';
            updateCanvas();
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'social-media-post.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        updateCanvas();
    </script>
</body>
</html>
